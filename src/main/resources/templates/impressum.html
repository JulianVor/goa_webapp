<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${edition}, 'Impressum')}"></head>
<body>
<div class="page-bg"></div>
<div th:replace="~{fragments/nav :: nav(${edition}, ${otherEditions})}"></div>

<section class="section-band legal-page">
    <div class="section">
    <h2 class="section-title">Impressum</h2>
    <p class="legal-text" th:if="${not #strings.isEmpty(edition.impressumText)}" th:text="${edition.impressumText}"></p>
    <p th:if="${#strings.isEmpty(edition.impressumText)}">Es wurde noch kein Impressum hinterlegt.</p>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
