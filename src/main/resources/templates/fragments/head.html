<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(edition, pageTitle)"
      th:with="effectiveBackground=${edition != null ? (edition.backgroundImagePath != null ? edition.backgroundImagePath : (edition.type.name() == 'KNEIPENKONZERT' and currentEdition != null ? currentEdition.backgroundImagePath : null)) : null}">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle} ?: (${edition} != null ? (${#strings.isEmpty(edition.displayLabel)} ? ${edition.title} : ${edition.title} + ' ' + ${edition.displayLabel}) : 'GOA Festival')">GOA Festival</title>
    <link rel="icon" th:if="${siteSettings != null and siteSettings.faviconImagePath != null}" th:href="${siteSettings.faviconImagePath}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <!-- The fixed background photo covers the whole viewport and is usually the largest
         asset on the page; preloading it avoids the browser discovering it late (it's
         only referenced from a CSS custom property, not a plain <img>). A Kneipenkonzert
         without its own background falls back to the current Festival edition's. -->
    <link rel="preload" as="image" th:if="${effectiveBackground != null}"
          th:href="${effectiveBackground}"/>
    <!-- Also loaded when only an archived year uses Bebas Neue: the nav's Archiv dropdown
         renders each year's own font, so this page needs the face even if its own
         edition doesn't use it. -->
    <link rel="stylesheet"
          th:if="${(edition != null and edition.headingFont == 'BEBAS_NEUE') or (archivedEditions != null and not #lists.isEmpty(archivedEditions.?[headingFont == 'BEBAS_NEUE']))}"
          href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"/>
    <style th:if="${edition != null}" th:utext="|
        :root {
            --color-primary: ${edition.colorSecondary};
            --color-secondary: ${edition.colorAccent2};
            --color-accent: ${edition.colorAccent2};
            --color-box: ${edition.colorBox};
            --color-accent-box: ${edition.colorAccentBox};
            --color-heading: ${edition.colorHeading};
            --color-heading-outline: ${edition.colorHeadingOutline};
            --color-text: ${edition.colorText};
            --box-radius: ${edition.boxRadius}px;
            --pill-radius: ${edition.pillRadius}px;
            --bg-image: url('${effectiveBackground ?: ''}');
            --font-display: ${edition.headingFont == 'BEBAS_NEUE' ? 'var(--font-stack-bebas)' : 'var(--font-stack-brugty)'};
            --font-body: ${edition.headingFont == 'BEBAS_NEUE' ? 'var(--font-stack-bebas)' : 'var(--font-stack-poppins)'};
            --font-weight-display: ${edition.headingFont == 'BEBAS_NEUE' ? 'bold' : 'normal'};
            --font-weight-body: normal;
        }
    |"></style>
</head>
</html>
