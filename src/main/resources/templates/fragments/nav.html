<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav class="site-nav" th:fragment="nav(edition, archivedEditions)"
     th:with="baseUrl=${edition.current} ? '/' : ('/goa/' + ${edition.year})">
    <a class="brand" th:href="@{/}">
        <img th:if="${siteSettings.logoImagePath}" th:src="${siteSettings.logoImagePath}" alt="Logo"/>
        <span th:unless="${siteSettings.logoImagePath}" th:text="${edition.title}">GOA</span>
    </a>

    <button class="nav-toggle" type="button" aria-label="Menü">☰</button>

    <div class="nav-links">
        <a class="pill" th:if="${edition.isShowEventInfos()}" th:href="${baseUrl} + '#event-infos'">Event-Infos</a>
        <a class="pill" th:if="${edition.isShowLineup()}" th:href="${baseUrl} + '#line-up'">Line-Up</a>
        <a class="pill" th:if="${edition.isShowFaq()}" th:href="${baseUrl} + '#faq'">FAQ</a>

        <span class="nav-socials">
            <a th:if="${not #strings.isEmpty(siteSettings.instagramUrl)}" th:href="${siteSettings.instagramUrl}" target="_blank" rel="noopener" title="Instagram">
                <img th:src="@{/img/icons/instagram.svg}" alt="Instagram"/>
            </a>
            <a th:if="${not #strings.isEmpty(siteSettings.facebookUrl)}" th:href="${siteSettings.facebookUrl}" target="_blank" rel="noopener" title="Facebook">
                <img th:src="@{/img/icons/facebook.svg}" alt="Facebook"/>
            </a>
            <a th:if="${not #strings.isEmpty(siteSettings.contactEmail)}" th:href="'mailto:' + ${siteSettings.contactEmail}" title="E-Mail">
                <img th:src="@{/img/icons/mail.svg}" alt="E-Mail"/>
            </a>
        </span>

        <a class="nav-history" th:if="${archivedEditions != null and #lists.size(archivedEditions) == 1}"
           th:href="@{'/goa/' + ${archivedEditions[0].year}}"
           th:text="'GOA ' + ${archivedEditions[0].year}">GOA 2025</a>

        <div class="nav-history-dropdown" th:if="${archivedEditions != null and #lists.size(archivedEditions) > 1}">
            <button type="button" class="nav-history dropdown-toggle">Archiv <span class="caret">▾</span></button>
            <div class="dropdown-menu">
                <a th:each="e : ${archivedEditions}" th:href="@{'/goa/' + ${e.year}}" th:text="'GOA ' + ${e.year}">GOA 2025</a>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
