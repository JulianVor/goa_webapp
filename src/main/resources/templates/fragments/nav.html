<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="nav(edition, archivedEditions)">
<nav class="site-nav"
     th:with="baseUrl=${edition.current} ? '/' : (${edition.type.name() == 'KNEIPENKONZERT'} ? ('/kneipenkonzerte/' + ${edition.id}) : ('/goa/' + ${edition.year}))">
    <a class="brand" th:href="@{/}">
        <img th:if="${siteSettings.logoImagePath}" th:src="${siteSettings.logoImagePath}" alt="Logo"/>
        <span th:unless="${siteSettings.logoImagePath}" th:text="${edition.title}">GOA</span>
    </a>

    <!-- Kneipenkonzert nav link sits right by the logo, ahead of the page-section
         anchors below: with several it goes to the overview (useful from any page,
         including another Kneipenkonzert's); with exactly one it links straight to
         it, except while already viewing that very page, where it'd be pointless. -->
    <a class="pill" th:if="${navKneipenkonzerte != null and #lists.size(navKneipenkonzerte) > 1}"
       th:href="@{/kneipenkonzerte}">Kneipenkonzerte</a>
    <a class="pill" th:if="${navKneipenkonzerte != null and #lists.size(navKneipenkonzerte) == 1 and edition.type.name() != 'KNEIPENKONZERT'}"
       th:href="@{'/kneipenkonzerte/' + ${navKneipenkonzerte[0].id}}"
       th:text="${navKneipenkonzerte[0].title}">Kneipenkonzert</a>

    <button class="nav-toggle" type="button" aria-label="Menü">☰</button>

    <div class="nav-links">
        <a class="pill" th:if="${edition.isShowEventInfos()}" th:href="${baseUrl} + '#event-infos'">Event-Infos</a>
        <a class="pill" th:if="${edition.isShowLineup()}" th:href="${baseUrl} + '#line-up'">Line-Up</a>
        <a class="pill" th:if="${edition.isShowFaq()}" th:href="${baseUrl} + '#faq'">FAQ</a>
        <button type="button" class="pill" th:if="${currentEdition != null and newsletterEnabled}" data-modal-open="newsletter-modal">Newsletter</button>

        <span class="nav-socials">
            <a th:if="${not #strings.isEmpty(siteSettings.instagramUrl)}" th:href="${siteSettings.instagramUrl}" target="_blank" rel="noopener" title="Instagram">
                <img th:src="@{/img/icons/instagram.svg}" alt="Instagram"/>
            </a>
            <a th:if="${not #strings.isEmpty(siteSettings.facebookUrl)}" th:href="${siteSettings.facebookUrl}" target="_blank" rel="noopener" title="Facebook">
                <img th:src="@{/img/icons/facebook.svg}" alt="Facebook"/>
            </a>
            <a th:if="${not #strings.isEmpty(siteSettings.contactEmail)}" th:href="'mailto:' + ${siteSettings.contactEmail}" title="E-Mail">
                <img th:src="@{/img/icons/mail.svg}" alt="E-Mail"/>
            </a>
        </span>

        <a class="nav-history" th:if="${archivedEditions != null and #lists.size(archivedEditions) == 1}"
           th:href="@{'/goa/' + ${archivedEditions[0].year}}"
           th:text="'GOA ' + ${archivedEditions[0].year}">GOA 2025</a>

        <div class="nav-history-dropdown" th:if="${archivedEditions != null and #lists.size(archivedEditions) > 1}">
            <button type="button" class="nav-history dropdown-toggle">Archiv <span class="caret">▾</span></button>
            <div class="dropdown-menu">
                <a th:each="e : ${archivedEditions}" th:href="@{'/goa/' + ${e.year}}" th:text="'GOA ' + ${e.year}">GOA 2025</a>
            </div>
        </div>
    </div>
</nav>

<!-- Always uses the current Festival's own colors, regardless of which edition's
     page it's shown on (an archived year, a Kneipenkonzert, ...), since it's the
     one signup for the whole site, not a per-edition thing. -->
<div class="modal-overlay newsletter-modal" id="newsletter-modal" th:if="${currentEdition != null and newsletterEnabled}"
     th:classappend="${newsletterSuccess != null or newsletterError != null} ? ' open' : ''"
     th:style="|--color-primary: ${currentEdition.colorPrimary}; --color-secondary: ${currentEdition.colorSecondary}; --color-accent: ${currentEdition.colorAccent}; --color-text: ${currentEdition.colorAccent};|">
    <div class="modal-box">
        <button type="button" class="modal-close" aria-label="Schließen">&times;</button>
        <h3>Newsletter abonnieren</h3>
        <p>Bleib auf dem Laufenden über Termine, Line-Ups und News.</p>
        <form method="post" th:action="@{/newsletter/subscribe}" class="newsletter-form">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="email" name="email" placeholder="deine@email.de" required="required"/>
            <div class="g-recaptcha" th:if="${not #strings.isEmpty(recaptchaSiteKey)}" th:attr="data-sitekey=${recaptchaSiteKey}"></div>
            <button type="submit" class="newsletter-submit">Anmelden</button>
        </form>
        <p class="newsletter-success" th:if="${newsletterSuccess}" th:text="${newsletterSuccess}"></p>
        <p class="newsletter-error" th:if="${newsletterError}" th:text="${newsletterError}"></p>
    </div>
</div>
<script th:if="${currentEdition != null and newsletterEnabled and not #strings.isEmpty(recaptchaSiteKey)}"
        src="https://www.google.com/recaptcha/api.js" async="async" defer="defer"></script>
</th:block>
</body>
</html>
