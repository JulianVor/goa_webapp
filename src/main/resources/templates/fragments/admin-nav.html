<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav class="admin-nav" th:fragment="admin-nav">
    <a class="admin-brand" th:href="@{/admin}">GOA Admin</a>
    <div class="admin-nav-links">
        <a th:href="@{/admin/settings}">Globale Einstellungen</a>
        <a th:href="@{/}" target="_blank">Seite ansehen ↗</a>
        <form th:action="@{/logout}" method="post" class="inline-form">

            <button type="submit" class="link-button">Abmelden</button>
        </form>
    </div>
</nav>
</body>
</html>
