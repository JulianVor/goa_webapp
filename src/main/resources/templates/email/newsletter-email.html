<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="max-width:600px;width:100%;background-color:#ffffff;border-radius:8px;overflow:hidden;font-family:Arial,Helvetica,sans-serif;">
                <tr>
                    <td th:style="'background-color:' + ${colorPrimary} + ';padding:24px;text-align:center;'">
                        <img th:if="${logoUrl}" th:src="${logoUrl}" alt="Logo" style="max-height:60px;"/>
                        <h1 th:unless="${logoUrl}" th:text="${editionTitle}"
                            style="color:#ffffff;margin:0;font-size:22px;font-family:Arial,Helvetica,sans-serif;">GOA</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px 24px;color:#222222;font-size:16px;line-height:1.6;" th:utext="${contentHtml}">
                        Inhalt
                    </td>
                </tr>
                <tr>
                    <td th:style="'background-color:' + ${colorAccent} + ';height:4px;line-height:4px;font-size:0;'">&nbsp;</td>
                </tr>
                <tr>
                    <td style="padding:16px 24px;text-align:center;color:#888888;font-size:12px;font-family:Arial,Helvetica,sans-serif;">
                        <p style="margin:0 0 8px;">Du erhältst diese E-Mail, weil du dich für den Newsletter angemeldet hast.</p>
                        <p style="margin:0;"><a th:href="${unsubscribeUrl}" style="color:#888888;">Newsletter abbestellen</a></p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
