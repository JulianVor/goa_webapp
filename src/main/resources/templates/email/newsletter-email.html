<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="max-width:600px;width:100%;border-radius:12px;overflow:hidden;font-family:Arial,Helvetica,sans-serif;">
                <tr>
                    <!-- The primary color is one continuous fill behind the header text AND the hero
                         image below it - never rounded itself. With an image, it's an absolutely
                         positioned backdrop filling exactly the height of the content/footer panels
                         next to it (position:absolute is best-effort in mail clients, same as
                         background-image itself - Outlook desktop just shows colorPrimary alone), so it
                         covers the whole rest of the card - however long the content ends up being -
                         instead of a fixed band. Its own border-radius+overflow:hidden, with nothing
                         else on that element, is what keeps the corner glitch-free. -->
                    <td th:style="'background-color:' + ${colorPrimary} + ';padding:0;'">
                        <div style="padding:8px 24px 16px;text-align:center;">
                            <!-- If the logo image itself fails to load, the browser/mail client falls
                                 back to rendering this alt text using the img's own font styles - so it
                                 shows the edition title, bold, in the secondary color, instead of a bare
                                 "Logo" label. -->
                            <img th:if="${logoUrl}" th:src="${logoUrl}" th:alt="${editionTitle}"
                                 th:style="'max-height:64px;display:inline-block;color:' + ${colorSecondary} + ';font-weight:bold;font-family:Arial,Helvetica,sans-serif;'"/>
                            <h1 th:unless="${logoUrl}" th:text="${editionTitle}"
                                style="color:#ffffff;margin:0;font-size:20px;font-family:Arial,Helvetica,sans-serif;">GOA</h1>
                        </div>

                        <div th:if="${backgroundUrl}" style="position:relative;">
                            <div th:style="'position:absolute;top:0;left:0;right:0;bottom:0;border-radius:20px 20px 0 0;overflow:hidden;background-image:url(' + ${backgroundUrl} + ');background-size:cover;background-position:center;background-repeat:no-repeat;'"></div>
                            <div style="position:relative;padding:16px 20px 24px;">
                                <div th:style="'background-color:rgba(255,255,255,0.95);border-radius:12px;padding:20px 24px;color:#222222;font-size:16px;line-height:1.6;border-top:4px solid ' + ${colorAccent} + ';'"
                                     th:utext="${contentHtml}">
                                    Inhalt
                                </div>

                                <div style="margin-top:14px;background-color:rgba(255,255,255,0.92);border-radius:10px;padding:14px 18px;text-align:center;color:#666666;font-size:12px;font-family:Arial,Helvetica,sans-serif;">
                                    <p style="margin:0 0 6px;">Du erhältst diese E-Mail, weil du dich für den Newsletter angemeldet hast.</p>
                                    <p style="margin:0;"><a th:href="${unsubscribeUrl}" style="color:#666666;">Newsletter abbestellen</a></p>
                                </div>
                            </div>
                        </div>

                        <div th:unless="${backgroundUrl}" style="padding:16px 20px 24px;">
                            <div th:style="'background-color:rgba(255,255,255,0.95);border-radius:12px;padding:20px 24px;color:#222222;font-size:16px;line-height:1.6;border-top:4px solid ' + ${colorAccent} + ';'"
                                 th:utext="${contentHtml}">
                                Inhalt
                            </div>

                            <div style="margin-top:14px;background-color:rgba(255,255,255,0.92);border-radius:10px;padding:14px 18px;text-align:center;color:#666666;font-size:12px;font-family:Arial,Helvetica,sans-serif;">
                                <p style="margin:0 0 6px;">Du erhältst diese E-Mail, weil du dich für den Newsletter angemeldet hast.</p>
                                <p style="margin:0;"><a th:href="${unsubscribeUrl}" style="color:#666666;">Newsletter abbestellen</a></p>
                            </div>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
