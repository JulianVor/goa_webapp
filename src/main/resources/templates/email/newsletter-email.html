<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="max-width:600px;width:100%;border-radius:12px;overflow:hidden;font-family:Arial,Helvetica,sans-serif;">
                <tr>
                    <!-- The primary color is one continuous fill behind the header text AND the hero
                         image below it - never rounded itself. The hero image sits on top of that fill
                         in its own plain div carrying nothing but background-image + border-radius +
                         overflow:hidden (the same combination that already clips this card's own outer
                         corners reliably) - keeping that combination isolated on its own element, with
                         nothing else (padding, text, borders) mixed onto it, is what keeps the rounding
                         glitch-free; mixing it into the header cell alongside text/padding is what kept
                         producing weird corners in earlier attempts. A fixed height, not the image's own
                         (possibly very tall) aspect ratio, keeps the header from ballooning. -->
                    <td th:style="'background-color:' + ${colorPrimary} + ';padding:0;'">
                        <div style="padding:8px 24px 16px;text-align:center;">
                            <img th:if="${logoUrl}" th:src="${logoUrl}" alt="Logo" style="max-height:64px;display:inline-block;"/>
                            <h1 th:unless="${logoUrl}" th:text="${editionTitle}"
                                style="color:#ffffff;margin:0;font-size:20px;font-family:Arial,Helvetica,sans-serif;">GOA</h1>
                        </div>

                        <div th:if="${backgroundUrl}"
                             th:style="'height:200px;border-radius:20px 20px 0 0;overflow:hidden;background-image:url(' + ${backgroundUrl} + ');background-size:cover;background-position:center;background-repeat:no-repeat;'"></div>

                        <!-- Content/footer panels pulled up to sit inset into the image, like the site's
                             own hero. Only pulled up when there's an image to sit on - without one this
                             is just a plain stack straight below the header. -->
                        <div th:style="(${backgroundUrl} != null ? 'margin-top:-40px;' : '') + 'padding:0 20px 24px;'">
                            <div th:style="'background-color:rgba(255,255,255,0.95);border-radius:12px;padding:28px 24px;color:#222222;font-size:16px;line-height:1.6;border-top:4px solid ' + ${colorAccent} + ';'"
                                 th:utext="${contentHtml}">
                                Inhalt
                            </div>

                            <div style="margin-top:14px;background-color:rgba(255,255,255,0.92);border-radius:10px;padding:14px 18px;text-align:center;color:#666666;font-size:12px;font-family:Arial,Helvetica,sans-serif;">
                                <p style="margin:0 0 6px;">Du erhältst diese E-Mail, weil du dich für den Newsletter angemeldet hast.</p>
                                <p style="margin:0;"><a th:href="${unsubscribeUrl}" style="color:#666666;">Newsletter abbestellen</a></p>
                            </div>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
