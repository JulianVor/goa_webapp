<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="max-width:600px;width:100%;border-radius:12px;overflow:hidden;font-family:Arial,Helvetica,sans-serif;">
                <tr>
                    <!-- Solid-color header, logo/title straight on it (no overlay box needed - it's a
                         flat color, always readable). Its own rounded bottom corners are what make it
                         read as a distinct banner sitting above the hero image below. -->
                    <td th:style="'background-color:' + ${colorPrimary} + ';border-radius:0 0 24px 24px;padding:28px 24px;text-align:center;'">
                        <img th:if="${logoUrl}" th:src="${logoUrl}" alt="Logo" style="max-height:56px;display:inline-block;"/>
                        <h1 th:unless="${logoUrl}" th:text="${editionTitle}"
                            style="color:#ffffff;margin:0;font-size:22px;font-family:Arial,Helvetica,sans-serif;">GOA</h1>
                    </td>
                </tr>
                <tr>
                    <!-- The edition's hero image runs behind the content/footer, like on the site itself -
                         those sit on translucent panels on top of it instead of a plain white block below
                         it. background-image is best-effort (Outlook desktop falls back to colorPrimary
                         alone), never load-bearing for legibility - the panels are. -->
                    <td th:style="'background-color:' + ${colorPrimary} + ';' + (${backgroundUrl} != null ? ('background-image:url(' + ${backgroundUrl} + ');background-size:cover;background-position:center;background-repeat:no-repeat;') : '') + 'padding:24px 20px;'">
                        <div th:style="'background-color:rgba(255,255,255,0.95);border-radius:12px;padding:28px 24px;color:#222222;font-size:16px;line-height:1.6;border-top:4px solid ' + ${colorAccent} + ';'"
                             th:utext="${contentHtml}">
                            Inhalt
                        </div>

                        <div style="margin-top:14px;background-color:rgba(255,255,255,0.92);border-radius:10px;padding:14px 18px;text-align:center;color:#666666;font-size:12px;font-family:Arial,Helvetica,sans-serif;">
                            <p style="margin:0 0 6px;">Du erhältst diese E-Mail, weil du dich für den Newsletter angemeldet hast.</p>
                            <p style="margin:0;"><a th:href="${unsubscribeUrl}" style="color:#666666;">Newsletter abbestellen</a></p>
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
