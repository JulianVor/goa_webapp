<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head-admin :: head-admin('Locations')}"></head>
<body class="admin-body">
<div th:replace="~{fragments/admin-nav :: admin-nav}"></div>

<main class="admin-main">
    <div class="admin-header-row">
        <h1>Locations</h1>
        <a class="btn btn-primary" th:href="@{/admin/locations/new}">+ Neue Location</a>
    </div>

    <p class="flash-success" th:if="${success}" th:text="${success}"></p>
    <p class="flash-error" th:if="${error}" th:text="${error}"></p>

    <div class="table-scroll">
    <table class="admin-table">
        <thead>
        <tr>
            <th>Name</th>
            <th>Straße & Nr.</th>
            <th>PLZ & Ort</th>
            <th>Aktionen</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="location : ${locations}">
            <td th:text="${location.name}">Tipsy Apes</td>
            <td th:text="${location.street}">Am Radeland 25</td>
            <td th:text="${location.zipCity}">21079 Hamburg</td>
            <td class="actions">
                <a th:href="@{'/admin/locations/' + ${location.id} + '/edit'}">Bearbeiten</a>
                <form th:action="@{'/admin/locations/' + ${location.id} + '/delete'}" method="post" class="inline-form"
                      onsubmit="return confirm('Location wirklich löschen?');">
                    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="link-button link-danger">Löschen</button>
                </form>
            </td>
        </tr>
        <tr th:if="${locations.isEmpty()}">
            <td colspan="4">Noch keine Location angelegt.</td>
        </tr>
        </tbody>
    </table>
    </div>
</main>
</body>
</html>
