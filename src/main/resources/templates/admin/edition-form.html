<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head-admin :: head-admin(${isNew} ? 'Neues Jahr anlegen' : 'Ausgabe bearbeiten')}"></head>
<body class="admin-body">
<div th:replace="~{fragments/admin-nav :: admin-nav}"></div>

<main class="admin-main">
    <h1 th:text="${isNew} ? 'Neues Jahr anlegen' : 'Ausgabe bearbeiten'">Ausgabe</h1>

    <form method="post" enctype="multipart/form-data" class="admin-form"
          th:action="${isNew} ? @{/admin/editions} : @{'/admin/editions/' + ${editionForm.id}}"
          th:object="${editionForm}">
        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <fieldset>
            <legend>Grunddaten</legend>
            <div class="form-row">
                <label>Jahr<input type="number" th:field="*{year}" required="required"/></label>
                <label>Anzeige-Label (Hero)<input type="text" th:field="*{displayLabel}" placeholder="z.B. 2026 oder 60" required="required"/></label>
            </div>
            <label>Titel<input type="text" th:field="*{title}" placeholder="z.B. Grumbrechtstraßen Open Air" required="required"/></label>
            <div class="form-row">
                <label>Headliner<input type="text" th:field="*{headlinerName}" placeholder="z.B. Tipsy Apes"/></label>
                <label>Headliner Datums-Label<input type="text" th:field="*{headlinerDateLabel}" placeholder="z.B. 10./11.07.26"/></label>
            </div>
            <div class="form-row">
                <label>Startdatum<input type="date" th:field="*{startDate}"/></label>
                <label>Enddatum<input type="date" th:field="*{endDate}"/></label>
            </div>
            <label class="checkbox-row"><input type="checkbox" th:field="*{current}"/> Als aktuelle Festival-Seite ("/") anzeigen</label>
        </fieldset>

        <fieldset>
            <legend>Event-Infos (Was / Wo)</legend>
            <label>Beschreibung ("Was?")<textarea th:field="*{aboutText}" rows="4"></textarea></label>
            <div class="form-row">
                <label>Ort / Location<input type="text" th:field="*{locationName}"/></label>
                <label>Straße & Nr.<input type="text" th:field="*{locationStreet}"/></label>
                <label>PLZ & Ort<input type="text" th:field="*{locationZipCity}"/></label>
            </div>
            <label>Adresse für Karte & Route (Google Maps)<input type="text" th:field="*{mapQuery}" placeholder="z.B. Am Radeland 25, 21079 Hamburg"/></label>
        </fieldset>

        <fieldset>
            <legend>Farbkonzept</legend>
            <div class="form-row colors">
                <label>Primärfarbe<input type="color" th:field="*{colorPrimary}"/></label>
                <label>Sekundärfarbe<input type="color" th:field="*{colorSecondary}"/></label>
                <label>Akzentfarbe<input type="color" th:field="*{colorAccent}"/></label>
                <label>Textfarbe<input type="color" th:field="*{colorText}"/></label>
            </div>
        </fieldset>

        <fieldset>
            <legend>Logo & Hintergrund</legend>
            <div class="form-row">
                <label>Logo (PNG/SVG)<input type="file" name="logoImage" accept="image/*"/></label>
                <label>Hintergrundbild (Hero, fix)<input type="file" name="backgroundImage" accept="image/*"/></label>
            </div>
            <div class="current-image-preview" th:if="${edition != null}">
                <img th:if="${edition.logoImagePath}" th:src="${edition.logoImagePath}" alt="Aktuelles Logo"/>
                <img th:if="${edition.backgroundImagePath}" th:src="${edition.backgroundImagePath}" alt="Aktueller Hintergrund"/>
            </div>
        </fieldset>

        <fieldset>
            <legend>Kontakt & Social (Navigation)</legend>
            <div class="form-row">
                <label>Instagram-URL<input type="text" th:field="*{instagramUrl}"/></label>
                <label>Facebook-URL<input type="text" th:field="*{facebookUrl}"/></label>
                <label>Kontakt E-Mail<input type="email" th:field="*{contactEmail}"/></label>
            </div>
        </fieldset>

        <fieldset>
            <legend>Impressum</legend>
            <label>Impressumstext<textarea th:field="*{impressumText}" rows="6"></textarea></label>
        </fieldset>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Speichern</button>
            <a class="btn" th:href="@{/admin}">Abbrechen</a>
        </div>
    </form>
</main>
</body>
</html>
