<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head-admin :: head-admin('Globale Einstellungen')}"></head>
<body class="admin-body">
<div th:replace="~{fragments/admin-nav :: admin-nav('settings')}"></div>

<main class="admin-main">
    <h1>Globale Einstellungen</h1>
    <p class="field-hint">
        Logo und Tab-Icon sind seitenübergreifend und unabhängig von der jeweils aktuellen Festival-Ausgabe.
    </p>

    <p class="flash-success" th:if="${success}" th:text="${success}"></p>

    <form method="post" enctype="multipart/form-data" class="admin-form" th:action="@{/admin/settings}" th:object="${settingsForm}">
        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <fieldset>
            <legend>Logo & Tab-Icon</legend>
            <div class="form-row">
                <label>Logo (Navigation, alle Seiten)<input type="file" name="logoImage" accept="image/*"/></label>
                <label>Tab-Icon (Favicon)<input type="file" name="faviconImage" accept="image/*"/></label>
            </div>
            <div class="current-image-preview">
                <img th:if="${siteSettings.logoImagePath}" th:src="${siteSettings.logoImagePath}" alt="Aktuelles Logo"/>
                <img th:if="${siteSettings.faviconImagePath}" th:src="${siteSettings.faviconImagePath}" alt="Aktuelles Tab-Icon"/>
            </div>
        </fieldset>

        <fieldset>
            <legend>Kontakt & Social (Navigation)</legend>
            <div class="form-row">
                <label>Instagram-URL<input type="text" th:field="*{instagramUrl}"/></label>
                <label>Facebook-URL<input type="text" th:field="*{facebookUrl}"/></label>
                <label>Kontakt E-Mail<input type="email" th:field="*{contactEmail}"/></label>
            </div>
        </fieldset>

        <fieldset>
            <legend>Impressum</legend>
            <p class="field-hint">Hier ist HTML erlaubt (z.B. &lt;p&gt;, &lt;br/&gt;, &lt;a&gt;) und wird auf der Impressum-Seite unverändert ausgegeben.</p>
            <label>Impressumstext (HTML)<textarea th:field="*{impressumText}" rows="10" class="code-textarea"></textarea></label>
        </fieldset>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Speichern</button>
            <a class="btn" th:href="@{/admin}">Zurück</a>
        </div>
    </form>
</main>
</body>
</html>
