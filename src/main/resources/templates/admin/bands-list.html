<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head-admin :: head-admin('Bands – ' + ${edition.title})}"></head>
<body class="admin-body">
<div th:replace="~{fragments/admin-nav :: admin-nav}"></div>

<main class="admin-main">
    <p><a th:href="@{/admin}">← Zurück zur Übersicht</a></p>
    <div class="admin-header-row">
        <h1 th:text="'Bands – ' + ${edition.title} + ' ' + ${edition.year}">Bands</h1>
        <a class="btn btn-primary" th:href="@{'/admin/editions/' + ${edition.id} + '/bands/new'}">+ Neue Band</a>
    </div>

    <p class="flash-success" th:if="${success}" th:text="${success}"></p>

    <div class="table-scroll">
    <table class="admin-table">
        <thead>
        <tr>
            <th>Name</th>
            <th>Genre</th>
            <th>Herkunft</th>
            <th>Auftritt</th>
            <th>Aktionen</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="band : ${bands}">
            <td th:text="${band.name}">Bandname</td>
            <td th:text="${band.genre}">Genre</td>
            <td th:text="${band.herkunft}">Herkunft</td>
            <td th:text="${T(de.goafestival.webapp.service.GermanDateFormats).dayAndTimeLabel(band.performanceAt)}">Freitag, 18:00 Uhr</td>
            <td class="actions">
                <a th:href="@{'/bands/' + ${band.id}}" target="_blank">Ansehen</a>
                <a th:href="@{'/admin/editions/' + ${edition.id} + '/bands/' + ${band.id} + '/edit'}">Bearbeiten</a>
                <form th:action="@{'/admin/editions/' + ${edition.id} + '/bands/' + ${band.id} + '/delete'}" method="post" class="inline-form"
                      onsubmit="return confirm('Band wirklich löschen?');">
                    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="link-button link-danger">Löschen</button>
                </form>
            </td>
        </tr>
        <tr th:if="${bands.isEmpty()}">
            <td colspan="5">Noch keine Band angelegt.</td>
        </tr>
        </tbody>
    </table>
    </div>

    <div class="admin-header-row" style="margin-top: 2rem;">
        <h2>Band aus anderem Jahr übernehmen</h2>
    </div>
    <form th:if="${!otherEditions.isEmpty()}" method="get" class="copy-from-form">
        <label>Jahr auswählen
            <select name="sourceEditionId">
                <option th:each="other : ${otherEditions}" th:value="${other.id}"
                        th:selected="${sourceEdition != null and sourceEdition.id == other.id}"
                        th:text="${other.title} + ' ' + ${other.year}">Jahr</option>
            </select>
        </label>
        <button type="submit" class="btn">Anzeigen</button>
    </form>

    <div class="table-scroll">
    <table class="admin-table" th:if="${sourceBands != null}">
        <thead>
        <tr>
            <th>Name</th>
            <th>Genre</th>
            <th>Herkunft</th>
            <th>Aktionen</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="band : ${sourceBands}">
            <td th:text="${band.name}">Bandname</td>
            <td th:text="${band.genre}">Genre</td>
            <td th:text="${band.herkunft}">Herkunft</td>
            <td class="actions">
                <form th:action="@{'/admin/editions/' + ${edition.id} + '/bands/copy'}" method="post" class="inline-form">
                    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="sourceBandId" th:value="${band.id}"/>
                    <input type="hidden" name="sourceEditionId" th:value="${sourceEdition.id}"/>
                    <button type="submit" class="link-button">Übernehmen</button>
                </form>
            </td>
        </tr>
        <tr th:if="${sourceBands.isEmpty()}">
            <td colspan="4">Diese Ausgabe hat keine Bands.</td>
        </tr>
        </tbody>
    </table>
    </div>
</main>
</body>
</html>
