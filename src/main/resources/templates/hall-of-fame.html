<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${edition}, ${pageTitle})}"></head>
<body>
<div class="page-bg"></div>
<div th:replace="~{fragments/nav :: nav(${edition}, ${archivedEditions})}"></div>

<section class="section-band hall-of-fame-page">
    <div class="section">
        <h1 class="section-title">Hall of Fame</h1>
        <p class="hall-of-fame-intro">Alle Bands, die jemals beim Grumbrechtstraßen Open Air gespielt haben – oder bald spielen werden.</p>

        <div class="hall-of-fame-grid">
            <a class="hof-card" th:each="band : ${bands}" th:href="@{'/bands/' + ${band.id}}">
                <img th:src="@{'/bands/' + ${band.id} + '/share-card.png'}" th:alt="${band.name}" loading="lazy"/>
            </a>
        </div>

        <p class="empty-hint" th:if="${bands.isEmpty()}">Noch wurden keine Bands hinterlegt.</p>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
