spring:
  application:
    name: goa-webapp
  datasource:
    url: jdbc:h2:file:./data/goa-webapp;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 60MB
  thymeleaf:
    cache: false

server:
  port: 8080

app:
  upload-dir: uploads
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}

logging:
  level:
    de.goafestival.webapp: INFO
