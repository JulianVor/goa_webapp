spring:
  application:
    name: goa-webapp
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/goa_webapp}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:goa}
    password: ${SPRING_DATASOURCE_PASSWORD:goa}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      # Runs schema.sql against the real (non-embedded) Postgres database too, not just
      # H2/embedded DBs. schema.sql only contains idempotent, additive fixes for schema
      # changes Hibernate's ddl-auto:update can't do safely on its own (backfilling a new
      # NOT NULL column, dropping a constraint that no longer applies) - it's safe to run
      # on every startup and runs before Hibernate's own schema check.
      mode: always
      # schema.sql uses Postgres DO $$ ... $$ blocks, which contain their own semicolons;
      # Spring's script splitter doesn't understand $$ dollar-quoting and would otherwise
      # cut a block apart at its first internal ";". Terminating each top-level statement
      # with "//" instead tells it where statements actually end.
      separator: "//"
  servlet:
    multipart:
      max-file-size: ${APP_MAX_UPLOAD_SIZE:50MB}
      max-request-size: ${APP_MAX_UPLOAD_REQUEST_SIZE:200MB}
  thymeleaf:
    # Re-parsing every template on every request is fine for local dev (hot template edits)
    # but wastes CPU per request in production. Default to cached; set THYMELEAF_CACHE=false
    # locally if you need template edits to show up without a restart.
    cache: ${THYMELEAF_CACHE:true}

server:
  port: 8080

app:
  upload-dir: uploads
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}

logging:
  level:
    de.goafestival.webapp: INFO
