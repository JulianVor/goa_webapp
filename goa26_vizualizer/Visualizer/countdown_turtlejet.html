<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>TURTLEJET Countdown 16:9</title>

<style>
@font-face {
    font-family: 'Brugty';
    src: url('BrugtyDemo-Regular.otf') format('opentype');
}

:root {
    --gold: #d9a441;
    --teal: #2a5d5a;
    --shadow: rgba(0, 0, 0, 0.9);

    /* Zentrale Breite: Bild und Countdown sind exakt gleich breit */
    --content-width: min(1100px, 82vw);
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Brugty', Arial, sans-serif;
}

/* 16:9 Bühne für OBS */
body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#stage {
    width: 100vw;
    height: 100vh;
    aspect-ratio: 16 / 9;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Gesamtes Overlay */
#container {
    width: min(1400px, 92vw);
    text-align: center;
    color: var(--gold);
    transform: translateY(-28px);
    animation: float 7s ease-in-out infinite;
}

/* Bandname */
#band-name {
    font-size: clamp(78px, 8.2vw, 150px);
    line-height: 0.9;
    margin: 0 0 22px 0;
    letter-spacing: 3px;

    -webkit-text-stroke: 3px var(--teal);
    text-shadow:
        -3px -3px 0 var(--teal),
         3px -3px 0 var(--teal),
        -3px  3px 0 var(--teal),
         3px  3px 0 var(--teal),
         0 12px 32px var(--shadow);

    filter: drop-shadow(0 10px 25px rgba(0,0,0,0.9));
}

/* Wrapper: Bild und Countdown teilen sich dieselbe Breite */
#content {
    width: var(--content-width);
    margin: 0 auto;
}

/* Bandfoto: exakt so breit wie der Countdown, immer 16:9 */
#band-img {
    width: 100%;
    height: auto;
    max-height: 52vh;

    object-fit: cover;
    object-position: center 35%;

    display: block;
    margin: 0 auto 22px auto;

    border-radius: 34px;
    border: 4px solid var(--teal);
    box-shadow:
        0 0 0 3px var(--teal),
        0 0 0 6px var(--gold),
        0 25px 60px rgba(0,0,0,0.9);

    animation: floatImg 6s ease-in-out infinite;
}

/* Countdown: exakt gleiche Breite wie das Bild */
#countdown {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr auto 1fr auto 1fr;
    align-items: start;
    column-gap: clamp(14px, 2vw, 38px);
    filter: drop-shadow(0 10px 25px rgba(0,0,0,0.9));
}

.time-block {
    text-align: center;
    min-width: 0;
}

.time-value {
    font-size: clamp(62px, 7vw, 120px);
    line-height: 0.85;
    letter-spacing: 2px;

    -webkit-text-stroke: 3px var(--teal);
    text-shadow:
        -3px -3px 0 var(--teal),
         3px -3px 0 var(--teal),
        -3px  3px 0 var(--teal),
         3px  3px 0 var(--teal),
         0 10px 28px var(--shadow);
}

.time-label {
    margin-top: 12px;
    font-size: clamp(22px, 2vw, 34px);
    letter-spacing: 4px;
    opacity: 1;

    -webkit-text-stroke: 1.5px var(--teal);
    text-shadow:
        -2px -2px 0 var(--teal),
         2px -2px 0 var(--teal),
        -2px  2px 0 var(--teal),
         2px  2px 0 var(--teal),
         0 8px 20px var(--shadow);
}

.separator {
    font-size: clamp(62px, 7vw, 120px);
    line-height: 0.85;

    -webkit-text-stroke: 3px var(--teal);
    text-shadow:
        -3px -3px 0 var(--teal),
         3px -3px 0 var(--teal),
        -3px  3px 0 var(--teal),
         3px  3px 0 var(--teal),
         0 10px 28px var(--shadow);
}

#days-countdown,
#now-message {
    width: 100%;
    font-size: clamp(70px, 8vw, 140px);
    line-height: 1;
    letter-spacing: 2px;

    -webkit-text-stroke: 3px var(--teal);
    text-shadow:
        -3px -3px 0 var(--teal),
         3px -3px 0 var(--teal),
        -3px  3px 0 var(--teal),
         3px  3px 0 var(--teal),
         0 10px 28px var(--shadow);

    filter: drop-shadow(0 10px 25px rgba(0,0,0,0.9));
}

#label {
    margin-top: 16px;
    font-size: clamp(28px, 2.8vw, 50px);
    letter-spacing: 3px;

    -webkit-text-stroke: 1.5px var(--teal);
    text-shadow:
        -2px -2px 0 var(--teal),
         2px -2px 0 var(--teal),
        -2px  2px 0 var(--teal),
         2px  2px 0 var(--teal),
         0 8px 20px var(--shadow);
}

.hidden { display: none !important; }

.final-seconds {
    color: #ff4444;
    animation: pulse 0.7s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(-28px); }
    50% { transform: translateY(-40px); }
}

@keyframes floatImg {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
}
</style>
</head>

<body>

<div id="stage">
    <div id="container">
		</br>
        <div id="band-name">TURTLEJET</div>

        <div id="content">
            <img id="band-img" src="../Bands/TurtleJetBandphoto.png" alt="TURTLEJET Bandfoto">
			</br>
            <div id="days-countdown" class="hidden">-- Tage</div>

            <div id="countdown">
                <div class="time-block">
                    <div id="hours" class="time-value">--</div>
                    <div class="time-label">STUNDEN</div>
                </div>

                <div class="separator">:</div>

                <div class="time-block">
                    <div id="minutes" class="time-value">--</div>
                    <div class="time-label">MINUTEN</div>
                </div>

                <div class="separator">:</div>

                <div class="time-block">
                    <div id="seconds" class="time-value">--</div>
                    <div class="time-label">SEKUNDEN</div>
                </div>
            </div>

            <div id="now-message" class="hidden">JETZT!</div>
        </div>

        <div id="label">BIS ZUM AUFTRITT</div>
    </div>
</div>

<script>
// Zielzeit: 10.07.2026 21:00 Uhr
// Hinweis: JavaScript zählt Monate ab 0, daher ist Juli = 6.
const targetDate = new Date(2026, 6, 11, 19, 30, 0);

const countdown = document.getElementById("countdown");
const daysCountdown = document.getElementById("days-countdown");
const nowMessage = document.getElementById("now-message");

const hoursEl = document.getElementById("hours");
const minutesEl = document.getElementById("minutes");
const secondsEl = document.getElementById("seconds");

function updateCountdown() {
    const now = new Date();
    const diff = targetDate - now;

    if (diff <= 0) {
        countdown.classList.add("hidden");
        daysCountdown.classList.add("hidden");
        nowMessage.classList.remove("hidden");
        nowMessage.classList.add("final-seconds");
        return;
    }

    const totalSeconds = Math.floor(diff / 1000);
    const totalHours = Math.floor(totalSeconds / 3600);

    // Mehr als 24 Stunden entfernt: Tage anzeigen
    if (totalHours >= 24) {
        const days = Math.floor(totalHours / 24);
        daysCountdown.textContent = days + (days === 1 ? " Tag" : " Tage");
        daysCountdown.classList.remove("hidden");
        countdown.classList.add("hidden");
        nowMessage.classList.add("hidden");
        nowMessage.classList.remove("final-seconds");
        return;
    }

    // Unter 24 Stunden: Stunden / Minuten / Sekunden mit Labels anzeigen
    daysCountdown.classList.add("hidden");
    nowMessage.classList.add("hidden");
    nowMessage.classList.remove("final-seconds");
    countdown.classList.remove("hidden");

    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    hoursEl.textContent = String(hours).padStart(2, "0");
    minutesEl.textContent = String(minutes).padStart(2, "0");
    secondsEl.textContent = String(seconds).padStart(2, "0");

    if (totalSeconds <= 10) {
        countdown.classList.add("final-seconds");
    } else {
        countdown.classList.remove("final-seconds");
    }
}

setInterval(updateCountdown, 1000);
updateCountdown();
</script>

</body>
</html>
