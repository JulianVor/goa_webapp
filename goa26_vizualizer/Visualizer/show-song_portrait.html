<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Festival Now Playing</title>

  <style>
    @font-face {
      font-family: "Brugty";
      src: url("BrugtyDemo-Regular.otf") format("opentype");
    }

    :root {
      --gold: #d9a441;
      --green: #2a5d5a;
      --shadow: rgba(0,0,0,0.6);
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      display: grid;
      place-items: center;
      font-family: "Brugty", sans-serif;
      text-transform: uppercase;
    }

    .player {
      width: 420px; /* doppelt so groß */
      min-height: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 28px 20px;
      border: 5px solid var(--green);
      border-radius: 28px;
      background: rgba(25, 25, 25, 0.85);
      box-shadow: 0 18px 50px var(--shadow);
      text-align: center;
    }

    .cover {
      width: 260px;
      height: 260px;
      border-radius: 20px;
      object-fit: cover;
      border: 5px solid var(--gold);
      box-shadow: 0 0 0 3px var(--green);
    }

    .kicker {
      font-size: 28px;
      color: var(--green);
      letter-spacing: 0.08em;
      -webkit-text-stroke: 1px var(--gold);
    }

    .track {
      font-size: 54px;
      color: var(--gold);
      line-height: 0.95;
      -webkit-text-stroke: 2px var(--green);
      text-shadow: 3px 3px 0 var(--shadow);
      overflow-wrap: anywhere;
    }

    .artist {
      font-size: 36px;
      color: var(--gold);
      -webkit-text-stroke: 1px var(--gold);
      text-shadow: 3px 3px 0 var(--shadow);
      overflow-wrap: anywhere;
    }

    .pulse {
      width: 18px;
      height: 18px;
      background: var(--gold);
      border-radius: 50%;
      display: inline-block;
      margin-right: 10px;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%,100% { transform: scale(0.7); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 1; }
    }
  </style>
</head>

<body>
  <div class="player">
    <img class="cover" id="cover" src="https://lastfm.freetls.fastly.net/i/u/300x300/2a96cbd8b46e442fc41c2b86b821562f.png">

    <div class="kicker"><span class="pulse"></span>Jetzt läuft</div>

    <div class="track" id="track">Test Track</div>
    <div class="artist" id="artist">Test Artist</div>
  </div>

  <script>
    const LASTFM_USER = "julianvornfeld";
    const LASTFM_API_KEY = "4edcdb8858dfc56bc2b51203b78f684a";

    async function update() {
      try {
        const res = await fetch(`https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${LASTFM_USER}&api_key=${LASTFM_API_KEY}&format=json&limit=1`);
        const data = await res.json();

        const track = data.recenttracks.track[0];

        document.getElementById("track").textContent = track.name;
        document.getElementById("artist").textContent = track.artist["#text"];

        const img = track.image.pop()["#text"];
        if (img) document.getElementById("cover").src = img;

      } catch(e) {
        console.log(e);
      }
    }

    setInterval(update, 8000);
    update();
  </script>
</body>
</html>
