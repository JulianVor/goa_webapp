<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TIDAL / Last.fm Now Playing Overlay</title>
  <style>
    @font-face {
      font-family: "Brugty";
      src: url("BrugtyDemo-Regular.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --gold: #d9a441;
      --green: #2a5d5a;
      --dark: rgba(10, 8, 14, 0.78);
      --shadow: rgba(0, 0, 0, 0.58);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      display: grid;
      place-items: center;
      font-family: "Brugty", Impact, Haettenschweiler, "Arial Black", system-ui, sans-serif;
      text-transform: uppercase;
    }

    .player {
      width: min(1180px, 94vw);
      min-height: 170px;
      display: grid;
      grid-template-columns: 145px 1fr;
      gap: 30px;
      align-items: center;
      padding: 24px 34px;
      border: 5px solid var(--green);
      border-radius: 30px;
      background: rgba(40, 40, 40, 0.85);
      box-shadow: 0 20px 48px var(--shadow);
    }

    .cover {
      width: 145px;
      height: 145px;
      border-radius: 22px;
      object-fit: cover;
      background: rgba(217, 164, 65, 0.16);
      border: 4px solid var(--gold);
      box-shadow:
        0 0 0 3px var(--green),
        8px 8px 0 rgba(0, 0, 0, 0.35);
    }

    .kicker {
      color: var(--green);
      font-size: 30px;
      letter-spacing: 0.09em;
      -webkit-text-stroke: 1px var(--gold);
      text-shadow: 3px 3px 0 var(--shadow);
      margin-bottom: 8px;
    }

    .track {
      color: var(--gold);
      font-size: clamp(50px, 5.8vw, 92px);
      line-height: 0.9;
      letter-spacing: 0.035em;
      -webkit-text-stroke: 2px var(--green);
      text-shadow:
        4px 4px 0 var(--green),
        9px 9px 0 var(--shadow);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist {
      margin-top: 12px;
      color: var(--green);
      font-size: clamp(34px, 3.3vw, 54px);
      letter-spacing: 0.04em;
      -webkit-text-stroke: 1px var(--gold);
      text-shadow: 4px 4px 0 var(--shadow);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pulse {
      display: inline-block;
      width: 18px;
      height: 18px;
      margin-right: 14px;
      border-radius: 999px;
      background: var(--gold);
      box-shadow: 0 0 18px var(--gold);
      animation: pulse 1.1s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.7); opacity: 0.65; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    @media (max-width: 700px) {
      .player { grid-template-columns: 96px 1fr; gap: 16px; padding: 16px; }
      .cover { width: 96px; height: 96px; }
      .kicker { font-size: 22px; }
    }
  </style>
</head>
<body>
  <main id="player" class="player visible" aria-live="polite">
    <img id="cover" class="cover" alt="Cover" src="https://lastfm.freetls.fastly.net/i/u/300x300/2a96cbd8b46e442fc41c2b86b821562f.png" />
    <section>
      <div class="kicker"><span class="pulse"></span>Jetzt läuft</div>
      <div id="track" class="track">Test Track</div>
      <div id="artist" class="artist">Test Artist</div>
    </section>
  </main>

  <script>
    const LASTFM_USER = "julianvornfeld";
    const LASTFM_API_KEY = "4edcdb8858dfc56bc2b51203b78f684a";
    const REFRESH_MS = 8000;
    const USE_LASTFM = true; // Erst auf true stellen, wenn der Test sichtbar ist.

    const el = {
      player: document.getElementById("player"),
      cover: document.getElementById("cover"),
      track: document.getElementById("track"),
      artist: document.getElementById("artist"),
    };

    let lastSignature = "";

    function text(value, fallback = "–") {
      return String(value || fallback).trim();
    }

    function getImage(track) {
      const images = track.image || [];
      const image = [...images].reverse().find(img => img["#text"]);
      return image ? image["#text"] : "";
    }

    async function updateNowPlaying() {
      if (!USE_LASTFM) return;

      try {
        const url = new URL("https://ws.audioscrobbler.com/2.0/");
        url.search = new URLSearchParams({
          method: "user.getrecenttracks",
          user: LASTFM_USER,
          api_key: LASTFM_API_KEY,
          format: "json",
          limit: "1",
        });

        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error("Last.fm nicht erreichbar");
        const data = await response.json();
        const track = data?.recenttracks?.track?.[0];

        if (!track) return;

        const title = text(track.name);
        const artist = text(track.artist?.["#text"] || track.artist);
        const cover = getImage(track);
        const signature = `${title}___${artist}___${cover}`;

        if (signature !== lastSignature) {
          el.track.textContent = title;
          el.artist.textContent = artist;
          if (cover) el.cover.src = cover;
          lastSignature = signature;
        }
      } catch (error) {
        console.error(error);
        el.track.textContent = "Last.fm Fehler";
        el.artist.textContent = "Konsole prüfen / API-Daten prüfen";
      }
    }

    updateNowPlaying();
    setInterval(updateNowPlaying, REFRESH_MS);
  </script>
</body>
</html>
