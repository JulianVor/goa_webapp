services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goa_webapp}
      POSTGRES_USER: ${POSTGRES_USER:-goa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goa}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goa} -d ${POSTGRES_DB:-goa_webapp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-goa_webapp}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-goa}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-goa}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      APP_UPLOAD_DIR: /data/uploads
      APP_MAX_UPLOAD_SIZE: ${APP_MAX_UPLOAD_SIZE:-50MB}
      APP_MAX_UPLOAD_REQUEST_SIZE: ${APP_MAX_UPLOAD_REQUEST_SIZE:-200MB}
      THYMELEAF_CACHE: ${THYMELEAF_CACHE:-true}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - uploads-data:/data/uploads

volumes:
  db-data:
  uploads-data:
